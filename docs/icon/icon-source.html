<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Zen+Kaku+Gothic+New:wght@900&display=swap" rel="stylesheet">
<style>body{margin:0;background:transparent}svg{display:block}
.hs{font-family:"Chakra Petch",sans-serif;font-weight:700}.ja{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900}</style></head><body>
<!-- 通常版（案 2-A：オレンジ地に黒の「HS」、黒帯に白の「合わせ」、角を斜めに切った形） -->
<div id="std" style="width:512px;height:512px"><svg width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#fff"/>
  <polygon points="72,24 488,24 488,440 440,488 24,488 24,72" fill="#ff6a00" stroke="#000" stroke-width="10"/>
  <text x="256" y="268" text-anchor="middle" class="hs" font-size="210" fill="#000" letter-spacing="-6">HS</text>
  <rect x="86" y="318" width="340" height="104" fill="#000"/>
  <text x="256" y="398" text-anchor="middle" class="ja" font-size="78" fill="#fff" letter-spacing="6">合わせ</text>
</svg></div>
<!-- マスカブル版（Android が丸や角丸に切り抜いても欠けないよう、中身を中央 80% に収める） -->
<div id="mask" style="width:512px;height:512px"><svg width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#ff6a00"/>
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)">
    <text x="256" y="268" text-anchor="middle" class="hs" font-size="210" fill="#000" letter-spacing="-6">HS</text>
    <rect x="86" y="318" width="340" height="104" fill="#000"/>
    <text x="256" y="398" text-anchor="middle" class="ja" font-size="78" fill="#fff" letter-spacing="6">合わせ</text>
  </g>
</svg></div>
</body></html>
